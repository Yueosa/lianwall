# LianWall 配置示例 - mpvpaper 自动适应功能

## 路径配置
[paths]
video_cache = "~/.cache/lianwall/video.json"
image_cache = "~/.cache/lianwall/image.json"
video_dir = "~/Videos/background"
image_dir = "~/Pictures/wallpapers"

## 动态壁纸引擎配置 (mpvpaper)
[video_engine]
type = "mpvpaper"
interval = 600  # 切换间隔（秒）

# 壁纸适应模式:
# - "auto": 自动适应（mpv 默认行为）
# - "contain": 完整显示壁纸，保持原始比例，可能有黑边
# - "cover": 填充整个屏幕，使用 panscan 裁剪视频
# - "fill": 拉伸填充屏幕，不保持原始比例（会变形）
# - "crop": 智能裁剪，自动检测显示器分辨率并强制缩放裁剪（推荐，无黑边）
fit_mode = "crop"

# panscan 值（0.0 到 1.0）
# 仅在 cover 模式下生效
# 1.0 = 完全填充屏幕（可能裁剪更多）
# 0.0 = 最小裁剪
panscan = 1.0

## 静态壁纸引擎配置 (swww)
[image_engine]
type = "swww"
interval = 300
transition = "fade"
transition_duration = 2.0

## 权重配置
[weight]
base = 100.0
select_penalty = 10.0
perturbation_ratio = 0.03
normalization_threshold = 500.0
normalization_target = 100.0
shuffle_period = 100
shuffle_intensity = 0.1

## 显存监控配置
[vram]
enabled = true
threshold_percent = 25.0
recovery_percent = 40.0
check_interval = 10
