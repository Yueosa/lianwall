[package]
name = "lianwall"
version = "3.0.1"
edition = "2024"

[workspace]
resolver = "2"
members = [
    "crates/lianwall-core",
    "crates/lianwall-daemon",
    "crates/lianwall-cli",
]

[workspace.package]
version = "4.0.0"
edition = "2024"
license = "MIT"
authors = ["Sakurine"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.8"
dirs = "6.0.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
thiserror = "2.0"
chrono = "0.4"
tokio = { version = "1", features = ["full", "net", "io-util", "sync", "time", "signal"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"


# 临时指向 src_next 进行测试
[[bin]]
name = "lianwall"
path = "src_next/main.rs"

# 生成动态库供 GUI 调用
[lib]
name = "lianwall"
path = "src_next/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.8"
dirs = "6.0.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
thiserror = "2.0"
chrono = "0.4"

# NVML 原生库支持 (可选)
nvml-wrapper = { version = "0.10", optional = true }

[features]
default = []
nvml = ["nvml-wrapper"]  # 启用 NVIDIA 原生库支持

[dev-dependencies]
tempfile = "3.8"
