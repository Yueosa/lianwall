[workspace]
resolver = "2"
members = [
    "crates/lianwall-core",
    "crates/lianwall-cli",
]

name = "lianwall"
version = "4.0.0"

[workspace.package]
version = "4.0.0"
edition = "2024"
license = "MIT"
authors = ["Sakurine"]
repository = "https://github.com/Yueosa/lianwall"
description = "A smart wallpaper manager for Wayland with golden angle algorithm"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.8"
dirs = "6.0.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
thiserror = "2.0"
chrono = "0.4"

# 编译优化 - 最小体积
[profile.release]
opt-level = "z"     # 优化体积
lto = true          # 链接时优化
codegen-units = 1   # 单编译单元
strip = true        # 移除符号表
panic = "abort"     # 简化 panic 处理
