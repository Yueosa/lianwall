[workspace]
resolver = "2"
members = [
    "crates/lianwall-core",
    "crates/lianwall-cli",
    "crates/lianwall-daemon",
]

name = "lianwall"
version = "5.1.5"

[workspace.package]
version = "5.1.5"
edition = "2024"
license = "MIT"
authors = ["Lian"]
repository = "https://github.com/Yueosa/lianwall"
description = "Selects wallpapers using the golden angle algorithm, sprinkled with Lian's magic"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.8"
dirs = "6.0.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
thiserror = "2.0"
chrono = "0.4"
# Phase 2: Async dependencies
tokio = { version = "1.43", features = ["rt-multi-thread", "process", "sync", "time", "fs", "io-util", "macros", "net", "signal"] }
rayon = "1.10"
walkdir = "2.5"
num_cpus = "1.16"
# Phase 3: Daemon dependencies
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# 编译优化 - 最小体积
[profile.release]
opt-level = "z"     # 优化体积
lto = true          # 链接时优化
codegen-units = 1   # 单编译单元
strip = true        # 移除符号表
panic = "abort"     # 简化 panic 处理
