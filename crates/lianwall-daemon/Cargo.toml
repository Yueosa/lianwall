[package]
name = "lianwall-daemon"
version = "5.0.0"
edition = "2021"
description = "LianWall wallpaper daemon"
authors = ["Sakurine"]
license = "MIT"

[[bin]]
name = "lianwalld"
path = "src/main.rs"

[dependencies]
lianwall-core = { path = "../lianwall-core" }

# Async runtime
tokio.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Serialization (for protocol)
serde.workspace = true
serde_json.workspace = true

# Time
chrono.workspace = true

[dev-dependencies]
toml.workspace = true
