[package]
name = "lianwall-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Daemon for lianwall - smart wallpaper manager"

[[bin]]
name = "lianwalld"
path = "src/main.rs"

[dependencies]
lianwall-core = { path = "../lianwall-core" }
thiserror.workspace = true
clap.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
polling = "3"
signal-hook = "0.3"
