[package]
name = "lianwall-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "LianWall - smart wallpaper manager with golden angle algorithm"

[[bin]]
name = "lianwall"
path = "src/main.rs"

[dependencies]
lianwall-core = { path = "../lianwall-core" }
clap.workspace = true
colored.workspace = true
thiserror.workspace = true
serde_json.workspace = true
toml.workspace = true
atty = "0.2"

# Daemon 依赖
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
polling = "3"
signal-hook = "0.3"
